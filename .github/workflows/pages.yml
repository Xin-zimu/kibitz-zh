name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the Pages deployment; one concurrent deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

# The kibitz app runs on Fly.io (stateful relay + WebSockets); this Pages site
# is the static landing page only. No WASM build — just publish docs/.
jobs:
  deploy:
    # Upstream-only: this publishes upstream's landing page. A fork has no Pages
    # site to deploy, and `enablement: true` would create one, so skip elsewhere.
    # The workflow stays in place to keep upstream syncs conflict-free.
    if: github.repository == 'richardwooding/kibitz'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true # create/enable the Pages site if it isn't already
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
